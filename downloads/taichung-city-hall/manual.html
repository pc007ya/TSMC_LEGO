<script>
'use strict';
// Each art stamp stores a lit surface and its depth in the common orthographic frame.
async function decodeStamp(url) {
  const image = new Image();
  image.src = url;
  await image.decode();
  const canvas = document.createElement('canvas');
  const w = canvas.width = image.width, h = canvas.height = image.height;
  const ctx = canvas.getContext('2d', {willReadFrequently:true});
  ctx.drawImage(image, 0, 0);
  const rgba = ctx.getImageData(0, 0, w, h).data;
  const samples = [];
  for (let i=0; i<w*h; i++) {
    if (!rgba[4*i+3]) continue;
    const edge = !((i%w)>0 && (i%w)<w-1 && i>=w && i<(h-1)*w &&
      rgba[4*(i-1)+3] && rgba[4*(i+1)+3] && rgba[4*(i-w)+3] && rgba[4*(i+w)+3]);
    samples.push(i%w, Math.floor(i/w), rgba[4*i]+256*rgba[4*i+1]-32768, rgba[4*i+2], edge?1:0);
  }
  return {w, h, samples:new Int32Array(samples)};
}

async function buildView(atlas, plan, colors) {
  const sprites=await Promise.all(atlas.sprites.map(decodeStamp));
  const depth = new Int32Array(atlas.width*atlas.height);
  const shade = new Uint8Array(depth.length);
  let index=0;
  function reset() {depth.fill(-2147483648); shade.fill(247); index=0}
  reset();
  function place(i, draw) {
    const [key,x,y,z] = atlas.placements[i], stamp=sprites[key];
    const p=stamp.samples;
    let center=null, nearest=Infinity;
    for (let j=0; j<p.length; j+=5) {
      const px=x+p[j], py=y+p[j+1], k=py*atlas.width+px, newDepth=z+p[j+2];
      if (newDepth<depth[k]-1) continue;
      depth[k]=newDepth;
      shade[k]=p[j+4]?177:Math.round(125+103*p[j+3]/255);
      if (!draw) continue;
      draw(px,py,p[j+3],p[j+4]);
      const distance=(p[j]-(stamp.w-1)/2)**2+(p[j+1]-(stamp.h-1)/2)**2;
      if (distance<nearest){nearest=distance;center=[px,py]}
    }
    return center || [x+stamp.w/2,y+stamp.h/2];
  }
  return function drawFigure(target,page) {
    if (index>page.start) reset();
    while(index<page.start) place(index++,null);
    const active=atlas.placements.slice(index,index+page.rows.length);
    let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
    for(const [key,x,y] of active) {
      x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x+sprites[key].w);y1=Math.max(y1,y+sprites[key].h);
    }
    const destW=720,destH=444,pad=(plan?5:6)*atlas.unit;
    const factor=Math.min(destW/(x1-x0+pad),destH/(y1-y0+pad),4.5);
    const w=Math.ceil(destW/factor),h=Math.ceil(destH/factor);
    const left=Math.floor((x0+x1-w)/2),top=Math.floor((y0+y1-h)/2);
    const local=document.createElement('canvas');local.width=w;local.height=h;
    const ctx=local.getContext('2d'),frame=ctx.createImageData(w,h),rgba=frame.data;
    for(let y=0;y<h;y++) for(let x=0;x<w;x++) {
      const ax=x+left,ay=y+top;
      const v=ax>=0&&ay>=0&&ax<atlas.width&&ay<atlas.height?shade[ay*atlas.width+ax]:247,k=(y*w+x)*4;
      const grid=plan&&v===247&&((ax+atlas.origin[0])%atlas.unit===0||(ay+atlas.origin[1])%atlas.unit===0);
      rgba[k]=grid?220:v;rgba[k+1]=grid?227:v;rgba[k+2]=grid?224:v;rgba[k+3]=255;
    }
    const centers=[];
    for(const row of page.rows) {
      const color=colors[row[1]],edge=plan?[37,74,74]:[169,78,34];
      const [mx,my]=place(index++,(px,py,brightness,border)=>{
        const k=((py-top)*w+px-left)*4;
        for(let c=0;c<3;c++) rgba[k+c]=border?edge[c]:Math.round(color[c]*brightness/255);
      });
      centers.push([row[0],(mx-left)*destW/w,(my-top)*destH/h]);
    }
    ctx.putImageData(frame,0,0);
    target.width=destW;target.height=destH;
    const out=target.getContext('2d');out.drawImage(local,0,0,destW,destH);
    if (!plan) return;
    const used=[];
    for(const [n,x,y] of centers) {
      const candidates=[[0,0],[0,-29],[0,29],[-29,0],[29,0],[-31,-24],[31,-24],[-31,24],[31,24],[0,-53],[0,53]];
      let best;
      for(const [dx,dy] of candidates){
        best=[Math.max(15,Math.min(destW-15,x+dx)),Math.max(15,Math.min(destH-15,y+dy))];
        if(used.every(([u,v])=>Math.hypot(best[0]-u,best[1]-v)>28))break;
      }
      const [bx,by]=best;used.push(best);
      out.strokeStyle='#254a4a';out.lineWidth=2;out.beginPath();out.moveTo(x,y);out.lineTo(bx,by);out.stroke();
      out.beginPath();out.arc(bx,by,13,0,2*Math.PI);out.fillStyle='#254a4a';out.fill();out.strokeStyle='white';out.stroke();
      out.font='bold 17px sans-serif';out.textAlign='center';out.textBaseline='middle';out.fillStyle='white';out.fillText(n,bx,by+1);
    }
  }
}

const data=JSON.parse(document.querySelector('#manual').textContent);
const el=id=>document.getElementById(id);
function set(id,value){el(id).textContent=value}
function tag(name,value,cls=''){const n=document.createElement(name);if(value!==undefined)n.textContent=value;if(cls)n.className=cls;return n}
function img(uri,cls=''){const n=tag('img',undefined,cls);n.src=uri;n.alt='';return n}
function partCell(sku){const [id]=data.parts[sku],td=tag('td');td.append(img(data.thumbs[sku],'thumb'),document.createTextNode(data.names[id]+' '+id));return td}
const firstByStep=new Map();data.pages.forEach((p,i)=>{if(!firstByStep.has(p.step))firstByStep.set(p.step,i)});
data.bags.forEach((b,i)=>el('bag').add(new Option(String(i+1).padStart(2,'0')+'　'+b.name+'　／　'+b.count+' 件',String(i))));
document.title=data.name+'｜逐步組裝手冊';set('code','FABFORM　／　'+data.code);set('title',data.name);
set('spec',data.pieces.toLocaleString()+' 件　／　'+data.bags.length+' 袋　／　'+data.steps+' 步　／　'+data.base);
el('cover').src=data.cover;set('desc',data.description);set('guide',data.guide);set('ref',data.observation+' '+data.interpretation);
data.sources.forEach(s=>{const a=tag('a',s.label);a.href=s.url;a.target='_blank';a.rel='noopener';el('sources').append(a)});
el('jump').max=data.steps;
const inks=data.parts.map(([,color])=>data.colors[color].hex.slice(1).match(/../g).map(h=>parseInt(h,16)));
const viewsReady=Promise.all(data.atlases.map((atlas,i)=>buildView(atlas,i===0,inks)));
let current=0,lastBag=-1,generation=0;
function render(i,move=false){
 current=Math.max(0,Math.min(data.pages.length-1,i));const p=data.pages[current],b=data.bags[p.bag];
 el('bag').value=p.bag;el('jump').value=p.step;set('line','第 '+(p.bag+1)+' 袋　／　袋內步驟 '+p.local+'　／　圖 '+p.phase+' / '+p.phases);
 set('stepname',p.step+'　'+p.name);set('hint',p.hint);const drawId=++generation;
 viewsReady.then(views=>{if(drawId===generation){views[0](el('plan'),p);views[1](el('iso'),p)}});set('isocap','等角安裝圖 · '+data.direction);
 set('region',p.region+'。淡灰為已裝部分。 '+p.pivotNotes.join('。'));
 el('rows').replaceChildren();p.rows.forEach(([n,sku,x,z,h,dir])=>{const tr=tag('tr'),td=tag('td');td.append(tag('span',n,'number'));
 tr.append(td,partCell(sku),tag('td',data.colors[data.parts[sku][1]].name),tag('td',x+', '+z),tag('td',h),tag('td',dir));el('rows').append(tr)});
 el('signs').replaceChildren();p.stickers.forEach(s=>{const d=data.stickers[s],note=tag('div',undefined,'decal');note.append(img(d.image),tag('span',d.note));el('signs').append(note)});
 if(p.bag!==lastBag){set('bagheading','第 '+(p.bag+1)+' 袋零件清單 · '+b.count+' 件');el('inventory').replaceChildren();data.inventories[p.bag].forEach(([sku,qty])=>{const tr=tag('tr');tr.append(partCell(sku),tag('td',data.colors[data.parts[sku][1]].name),tag('td',qty));el('inventory').append(tr)});lastBag=p.bag}
 el('prev').disabled=current===0;el('next').disabled=current===data.pages.length-1;set('page',(current+1)+' / '+data.pages.length+' 圖');
 if(move){try{history.replaceState(null,'','#p='+String(current+1))}catch{}el('step').scrollIntoView({block:'start'})}
}
el('bag').onchange=()=>render(data.bags[Number(el('bag').value)].first,true);
function jump(){if(el('jump').reportValidity()&&firstByStep.has(Number(el('jump').value)))render(firstByStep.get(Number(el('jump').value)),true)}
el('go').onclick=jump;el('jump').onkeydown=e=>{if(e.key==='Enter')jump()};
el('prev').onclick=()=>render(current-1,true);el('next').onclick=()=>render(current+1,true);
document.querySelectorAll('.zoom').forEach(b=>b.onclick=()=>{el('large').src=b.querySelector('canvas').toDataURL('image/png');el('detail').showModal()});
el('close').onclick=()=>el('detail').close();
function fromHash(){const n=Number(new URLSearchParams(location.hash.slice(1)).get('p'));render(Number.isInteger(n)&&n>0?n-1:0)}
window.addEventListener('hashchange',fromHash);fromHash();
</script></body></html>
